[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# URL 规范化（host/协议/大小写/尾斜杠/重复斜杠 301）+ 未知路径真 404（noindex）
# 注意：canonical / hreflang / title / og / json-ld 已由 Vite SSG 在构建期写入静态 HTML，
# 边缘层不再注入，避免与静态 HTML 既有标签重复。对应实现：netlify/edge-functions/seo-canonical.js
[[edge_functions]]
  path = "/*"
  function = "seo-canonical"

# 内容哈希静态资源：长期缓存 + 不可变，回访秒开、省带宽。
# 仅匹配 /assets/*（构建产物均带内容哈希），不缓存未哈希的 HTML 页面。
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
